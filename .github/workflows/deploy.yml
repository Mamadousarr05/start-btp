name: CI/CD - Build & Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois : un nouveau push attend la fin du précédent
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  DEPLOY_DIR: /opt/star-btp

jobs:
  build:
    name: Build & push image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR exige un nom d'image en minuscules
      - name: Nom de l'image
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy sur le VPS
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # deploy/compose.yml -> /opt/star-btp/compose.yml, deploy/caddy/ -> /opt/star-btp/caddy/
      - name: Copie de la config (Compose + Caddy)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: deploy/compose.yml,deploy/caddy/Caddyfile
          target: ${{ env.DEPLOY_DIR }}
          strip_components: 1
          overwrite: true

      - name: Déploiement via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          envs: IMAGE,GHCR_USER,GHCR_TOKEN,DEPLOY_DIR
          script: |
            set -eu
            cd "$DEPLOY_DIR"

            # 1. Installer Docker s'il est absent
            if ! command -v docker >/dev/null 2>&1; then
              echo ">> Docker absent, installation..."
              if command -v curl >/dev/null 2>&1; then
                curl -fsSL https://get.docker.com | sh
              else
                wget -qO- https://get.docker.com | sh
              fi
              systemctl enable --now docker
            fi
            docker --version
            docker compose version

            # 2. Image précédente (pour rollback)
            PREV_IMAGE=$(sed -n 's/^IMAGE=//p' .env 2>/dev/null || true)

            # Migration : ancien conteneur lancé avec "docker run" qui occupe le port 80
            if docker inspect star-btp >/dev/null 2>&1; then
              PREV_IMAGE=${PREV_IMAGE:-$(docker inspect -f '{{.Config.Image}}' star-btp)}
              docker rm -f star-btp >/dev/null
            fi

            # 3. Récupérer la nouvelle image depuis GHCR
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            IMAGE="$IMAGE" docker compose pull app
            docker logout ghcr.io

            start() {
              echo "IMAGE=$1" > .env
              docker compose up -d --remove-orphans
            }

            healthy() {
              for i in $(seq 1 15); do
                if docker compose exec -T app wget -qO /dev/null http://127.0.0.1/ 2>/dev/null; then
                  return 0
                fi
                sleep 2
              done
              return 1
            }

            # 4. Démarrer (Caddy + app) avec rollback si l'app ne répond pas
            if start "$IMAGE" && healthy; then
              echo ">> Déploiement OK : $IMAGE"
            else
              echo ">> Échec du déploiement de $IMAGE"
              docker compose logs --tail 50 app 2>&1 || true
              if [ -n "$PREV_IMAGE" ]; then
                echo ">> Rollback vers $PREV_IMAGE"
                start "$PREV_IMAGE"
              fi
              exit 1
            fi

            # 5. Recharger Caddy si le Caddyfile a changé (sans coupure ni perte des certificats)
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile

            # 6. Nettoyage : ne garder que l'image courante et la précédente
            REPO="${IMAGE%:*}"
            docker image ls "$REPO" --format '{{.Repository}}:{{.Tag}}' \
              | grep -vxF -e "$IMAGE" -e "${PREV_IMAGE:-none}" \
              | xargs -r docker rmi >/dev/null 2>&1 || true
