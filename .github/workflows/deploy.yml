name: CI/CD - Build & Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois : un nouveau push attend la fin du précédent
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  DEPLOY_DIR: /opt/star-btp

jobs:
  build:
    name: Build & push images (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR exige un nom d'image en minuscules
      - name: Nom des images
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push site
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=site
          cache-to: type=gha,mode=max,scope=site

      - name: Build & push API mails
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ${{ steps.image.outputs.name }}-api:latest
            ${{ steps.image.outputs.name }}-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  deploy:
    name: Deploy sur le VPS
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # deploy/compose.yml -> /opt/star-btp/compose.yml, deploy/caddy/ -> /opt/star-btp/caddy/
      - name: Copie de la config (Compose + Caddy)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: deploy/compose.yml,deploy/caddy/Caddyfile
          target: ${{ env.DEPLOY_DIR }}
          strip_components: 1
          overwrite: true

      - name: Déploiement via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
          API_IMAGE: ${{ needs.build.outputs.image }}-api:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          SMTP_HOST: greek.o2switch.net
          SMTP_PORT: "465"
          SMTP_USER: contact@star-btp.com
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: contact@star-btp.com
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          envs: IMAGE,API_IMAGE,GHCR_USER,GHCR_TOKEN,DEPLOY_DIR,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASSWORD,MAIL_TO
          script: |
            set -eu
            cd "$DEPLOY_DIR"

            # 1. Installer Docker s'il est absent
            if ! command -v docker >/dev/null 2>&1; then
              echo ">> Docker absent, installation..."
              if command -v curl >/dev/null 2>&1; then
                curl -fsSL https://get.docker.com | sh
              else
                wget -qO- https://get.docker.com | sh
              fi
              systemctl enable --now docker
            fi
            docker --version
            docker compose version

            # 2. Variables de l'API mails (api.env lisible par root uniquement)
            umask 077
            cat > api.env <<EOF
            SMTP_HOST=$SMTP_HOST
            SMTP_PORT=$SMTP_PORT
            SMTP_SECURITY=ssl
            SMTP_USER=$SMTP_USER
            SMTP_PASSWORD='$SMTP_PASSWORD'
            MAIL_FROM=$SMTP_USER
            MAIL_FROM_NAME=Site STAR-BTP
            MAIL_TO=$MAIL_TO
            RATE_LIMIT_PER_HOUR=5
            EOF
            umask 022

            # 3. Images en service (pour rollback)
            PREV_IMAGE=$(sed -n 's/^IMAGE=//p' .env 2>/dev/null || true)
            PREV_API_IMAGE=$(sed -n 's/^API_IMAGE=//p' .env 2>/dev/null || true)

            # 4. Récupérer les nouvelles images depuis GHCR
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE"
            docker pull "$API_IMAGE"
            docker logout ghcr.io

            start() {
              printf 'IMAGE=%s\nAPI_IMAGE=%s\n' "$1" "$2" > .env
              docker compose up -d --remove-orphans
            }

            healthy() {
              for i in $(seq 1 15); do
                if docker compose exec -T app wget -qO /dev/null http://127.0.0.1/ 2>/dev/null \
                  && docker compose exec -T api python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)" 2>/dev/null; then
                  return 0
                fi
                sleep 2
              done
              return 1
            }

            # 5. Démarrer (Caddy + site + API) avec rollback si un service ne répond pas
            if start "$IMAGE" "$API_IMAGE" && healthy; then
              echo ">> Déploiement OK : $IMAGE + $API_IMAGE"
            else
              echo ">> Échec du déploiement"
              docker compose logs --tail 50 app api 2>&1 || true
              if [ -n "$PREV_IMAGE" ]; then
                echo ">> Rollback vers $PREV_IMAGE"
                start "$PREV_IMAGE" "${PREV_API_IMAGE:-$API_IMAGE}"
              fi
              exit 1
            fi

            # 6. Recharger Caddy si le Caddyfile a changé (sans coupure ni perte des certificats)
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile

            # 7. Nettoyage : ne garder que les images courantes et précédentes
            for NEW in "$IMAGE" "$API_IMAGE"; do
              docker image ls "${NEW%:*}" --format '{{.Repository}}:{{.Tag}}' \
                | grep -vxF -e "$NEW" -e "${PREV_IMAGE:-none}" -e "${PREV_API_IMAGE:-none}" \
                | xargs -r docker rmi >/dev/null 2>&1 || true
            done
