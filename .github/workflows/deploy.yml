name: CI/CD - Build & Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois : un nouveau push attend la fin du précédent
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  CONTAINER_NAME: star-btp
  APP_PORT: 80

jobs:
  build:
    name: Build & push image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR exige un nom d'image en minuscules
      - name: Nom de l'image
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy sur le VPS
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Déploiement via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          APP_PORT: ${{ env.APP_PORT }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          envs: IMAGE,GHCR_USER,GHCR_TOKEN,CONTAINER_NAME,APP_PORT
          script: |
            set -eu

            # 1. Installer Docker s'il est absent
            if ! command -v docker >/dev/null 2>&1; then
              echo ">> Docker absent, installation..."
              if command -v curl >/dev/null 2>&1; then
                curl -fsSL https://get.docker.com | sh
              else
                wget -qO- https://get.docker.com | sh
              fi
              systemctl enable --now docker
            fi
            docker --version

            # 2. Récupérer la nouvelle image depuis GHCR
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE"
            docker logout ghcr.io

            # 3. Remplacer le conteneur en gardant l'image précédente pour rollback
            PREV_IMAGE=$(docker inspect -f '{{.Config.Image}}' "$CONTAINER_NAME" 2>/dev/null || true)
            docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true

            start() {
              docker run -d --name "$CONTAINER_NAME" --restart unless-stopped \
                -p "$APP_PORT:80" "$1"
            }

            healthy() {
              for i in $(seq 1 15); do
                if docker exec "$CONTAINER_NAME" wget -qO /dev/null http://127.0.0.1/ 2>/dev/null; then
                  return 0
                fi
                sleep 2
              done
              return 1
            }

            if start "$IMAGE" && healthy; then
              echo ">> Déploiement OK : $IMAGE"
            else
              echo ">> Échec du déploiement de $IMAGE"
              docker logs "$CONTAINER_NAME" 2>&1 | tail -n 50 || true
              docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
              if [ -n "$PREV_IMAGE" ]; then
                echo ">> Rollback vers $PREV_IMAGE"
                start "$PREV_IMAGE"
              fi
              exit 1
            fi

            # 4. Nettoyage : ne garder que l'image courante et la précédente
            REPO="${IMAGE%:*}"
            docker image ls "$REPO" --format '{{.Repository}}:{{.Tag}}' \
              | grep -vxF -e "$IMAGE" -e "${PREV_IMAGE:-none}" \
              | xargs -r docker rmi >/dev/null 2>&1 || true
